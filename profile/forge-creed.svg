<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="The Forge Creed - Architectural Philosophy &amp; Engineering Principles">
  <title>The Forge Creed - Architectural Philosophy</title>
  <desc>Engineering principles and architectural philosophy of NemeaForge Solutions: Distributed Resilience, High-Velocity Cloud, AI Systems, and Uncompromising Craftsmanship.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.5; }
        100% { transform: translateY(-45px) translateX(10px); opacity: 0; }
      }

      .pulse-slow { animation: pulseGlow 4s ease-in-out infinite; }
      .particle { animation: floatParticle 5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    ]]></style>

    <linearGradient id="creedBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <linearGradient id="creedBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <radialGradient id="creedCyanGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="creedGoldGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <filter id="creedBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="creedClip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#creedClip)">
    <!-- Base Background -->
    <rect width="1200" height="480" fill="url(#creedBg)"/>
    <rect width="1200" height="480" fill="url(#creedCyanGlow)"/>
    <rect width="1200" height="480" fill="url(#creedGoldGlow)"/>

    <!-- Subtle Circuit Trace / Energy Conduits -->
    <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2" fill="none">
      <path d="M40 80 H260 L290 110 H600"/>
      <path d="M1160 400 H940 L910 370 H600"/>
      <circle cx="260" cy="80" r="3" fill="#38bdf8"/>
      <circle cx="940" cy="400" r="3" fill="#fbbf24"/>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="478" rx="19" fill="none" stroke="url(#creedBorder)" stroke-width="1.6"/>

    <!-- Header Block -->
    <g transform="translate(60, 52)">
      <!-- Top Pill -->
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
      <text class="mono" x="24" y="16" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">THE FORGE CREED</text>

      <!-- Main Headline -->
      <text x="0" y="58" font-size="34" font-weight="900" fill="url(#headerGrad)" letter-spacing="-0.5" filter="url(#creedBlur)">
        Engineered for High Stakes &amp; High Velocity
      </text>

      <!-- Subtitle Quote -->
      <text class="mono" x="0" y="86" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
        “We don't just ship features — we forge resilient architectures designed to endure extreme loads.”
      </text>
    </g>

    <!-- 4 Architecture Pillars -->
    <g transform="translate(60, 172)">
      <!-- Pillar 1: Distributed Resilience -->
      <g transform="translate(0, 0)">
        <rect width="255" height="248" rx="14" fill="#0c1222" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="255" height="3" rx="1.5" fill="#38bdf8"/>
        
        <!-- Icon & Tag -->
        <circle cx="36" cy="38" r="18" fill="#0284c7" fill-opacity="0.2"/>
        <path d="M30 38 L34 42 L42 34" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="66" y="42" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">PILLAR 01</text>

        <!-- Title -->
        <text x="20" y="86" font-size="17" font-weight="800" fill="#f8fafc">Distributed Resilience</text>
        
        <!-- Description -->
        <text x="20" y="116" font-size="12.5" font-weight="400" fill="#94a3b8" line-height="1.5">
          <tspan x="20" dy="0">Decoupled microservices,</tspan>
          <tspan x="20" dy="20">circuit breakers, and graceful</tspan>
          <tspan x="20" dy="20">failover mechanisms that</tspan>
          <tspan x="20" dy="20">eliminate single points of</tspan>
          <tspan x="20" dy="20">failure across global regions.</tspan>
        </text>

        <!-- Stat Footnote -->
        <text class="mono" x="20" y="226" font-size="10" font-weight="600" fill="#38bdf8">→ 99.99% Uptime Target</text>
      </g>

      <!-- Pillar 2: High-Velocity Cloud -->
      <g transform="translate(275, 0)">
        <rect width="255" height="248" rx="14" fill="#0c1222" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="255" height="3" rx="1.5" fill="#2563eb"/>
        
        <!-- Icon & Tag -->
        <circle cx="36" cy="38" r="18" fill="#2563eb" fill-opacity="0.25"/>
        <path d="M30 35 H42 M30 41 H38" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
        <text class="mono" x="66" y="42" font-size="10.5" font-weight="700" fill="#60a5fa" letter-spacing="1">PILLAR 02</text>

        <!-- Title -->
        <text x="20" y="86" font-size="17" font-weight="800" fill="#f8fafc">Cloud-Native Fabric</text>
        
        <!-- Description -->
        <text x="20" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="20" dy="0">Multi-stage Alpine Docker</tspan>
          <tspan x="20" dy="20">containers, Kubernetes, and</tspan>
          <tspan x="20" dy="20">Cloudflare edge routing for</tspan>
          <tspan x="20" dy="20">instant scaling with zero</tspan>
          <tspan x="20" dy="20">deployment downtime.</tspan>
        </text>

        <!-- Stat Footnote -->
        <text class="mono" x="20" y="226" font-size="10" font-weight="600" fill="#60a5fa">→ Sub-12ms Edge Routing</text>
      </g>

      <!-- Pillar 3: AI & Vector Systems -->
      <g transform="translate(550, 0)">
        <rect width="255" height="248" rx="14" fill="#0c1222" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="255" height="3" rx="1.5" fill="#818cf8"/>
        
        <!-- Icon & Tag -->
        <circle cx="36" cy="38" r="18" fill="#4f46e5" fill-opacity="0.25"/>
        <circle cx="36" cy="38" r="5" fill="#a78bfa"/>
        <text class="mono" x="66" y="42" font-size="10.5" font-weight="700" fill="#a78bfa" letter-spacing="1">PILLAR 03</text>

        <!-- Title -->
        <text x="20" y="86" font-size="17" font-weight="800" fill="#f8fafc">Intelligent Engines</text>
        
        <!-- Description -->
        <text x="20" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="20" dy="0">Production RAG pipelines,</tspan>
          <tspan x="20" dy="20">pgvector embedding stores,</tspan>
          <tspan x="20" dy="20">and real-time inference</tspan>
          <tspan x="20" dy="20">harnesses integrated natively</tspan>
          <tspan x="20" dy="20">into core business workflows.</tspan>
        </text>

        <!-- Stat Footnote -->
        <text class="mono" x="20" y="226" font-size="10" font-weight="600" fill="#a78bfa">→ Real-Time Embedding Search</text>
      </g>

      <!-- Pillar 4: Uncompromising Craftsmanship -->
      <g transform="translate(825, 0)">
        <rect width="255" height="248" rx="14" fill="#0c1222" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="255" height="3" rx="1.5" fill="#fbbf24"/>
        
        <!-- Icon & Tag -->
        <circle cx="36" cy="38" r="18" fill="#d97706" fill-opacity="0.25"/>
        <path d="M36 28 L43 35 L36 48 L29 35 Z" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
        <text class="mono" x="66" y="42" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="1">PILLAR 04</text>

        <!-- Title -->
        <text x="20" y="86" font-size="17" font-weight="800" fill="#f8fafc">Zero-Debt Craft</text>
        
        <!-- Description -->
        <text x="20" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="20" dy="0">Strict TypeScript, idiomatic</tspan>
          <tspan x="20" dy="20">Go, automated contract</tspan>
          <tspan x="20" dy="20">testing, and obsessive</tspan>
          <tspan x="20" dy="20">attention to performance,</tspan>
          <tspan x="20" dy="20">security, and code clarity.</tspan>
        </text>

        <!-- Stat Footnote -->
        <text class="mono" x="20" y="226" font-size="10" font-weight="600" fill="#fbbf24">→ 100% Type &amp; Test Coverage</text>
      </g>
    </g>
  </g>
</svg>
