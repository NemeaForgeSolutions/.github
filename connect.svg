<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Let's Forge Something Extraordinary - Partner with NemeaForge Solutions">
  <title>Let's Forge Something Extraordinary - Partner with NemeaForge</title>
  <desc>Direct contact channels, commercial inquiry, and engineering engagement with NemeaForge Solutions.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes neonGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)) drop-shadow(0 0 16px rgba(37, 99, 235, 0.2)); }
        50% { filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.8)) drop-shadow(0 0 24px rgba(251, 191, 36, 0.3)); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .neon-card { animation: neonGlow 4s ease-in-out infinite; }
      .pulse-dot { animation: badgePulse 1.2s step-end infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>

    <linearGradient id="connectBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <linearGradient id="connectBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="connectTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <radialGradient id="connectRadial" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="connectClip"><rect width="1200" height="440" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#connectClip)">
    <!-- Base Background -->
    <rect width="1200" height="440" fill="url(#connectBg)"/>
    <rect width="1200" height="440" fill="url(#connectRadial)"/>

    <!-- Subtle Tech Trace Lines -->
    <g opacity="0.1" stroke="#38bdf8" stroke-width="1.2" fill="none">
      <path d="M50 70 H300 L330 100 H870 L900 70 H1150"/>
      <circle cx="300" cy="70" r="3.5" fill="#38bdf8"/>
      <circle cx="900" cy="70" r="3.5" fill="#fbbf24"/>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="url(#connectBorder)" stroke-width="1.6"/>

    <!-- Header Block -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="230" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#22c55e" class="pulse-dot"/>
      <text class="mono" x="24" y="16" font-size="10" font-weight="700" fill="#22c55e" letter-spacing="1.2">ACCEPTING ENTERPRISE BUILDS</text>

      <text x="0" y="58" font-size="34" font-weight="900" fill="url(#connectTitle)" letter-spacing="-0.6">
        Let's Forge Something Legendary
      </text>
      <text class="mono" x="0" y="86" font-size="13" font-weight="500" fill="#94a3b8">
        Partner with NemeaForge Solutions to architect, scale, and modernize your software systems.
      </text>
    </g>

    <!-- 3 Connect Cards Grid -->
    <g transform="translate(60, 165)">
      <!-- Card 1: Official Platform & Intake -->
      <g transform="translate(0, 0)">
        <rect width="345" height="220" rx="14" fill="#0c1222" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="345" height="3" rx="1.5" fill="#38bdf8"/>
        
        <circle cx="36" cy="38" r="16" fill="#0284c7" fill-opacity="0.25"/>
        <path d="M30 38 H42 M36 32 V44" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <text class="mono" x="64" y="42" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">WEB PLATFORM</text>

        <text x="24" y="86" font-size="20" font-weight="800" fill="#ffffff">nemeaforge.com</text>
        <text x="24" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="24" dy="0">Interactive system architecture</tspan>
          <tspan x="24" dy="20">canvas, technical case studies,</tspan>
          <tspan x="24" dy="20">and project discovery portal.</tspan>
        </text>

        <rect x="24" y="172" width="160" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
        <text class="mono" x="38" y="190" font-size="11" font-weight="700" fill="#38bdf8">Visit Website →</text>
      </g>

      <!-- Card 2: Direct Consultation & Email -->
      <g transform="translate(365, 0)">
        <rect width="345" height="220" rx="14" fill="#0c1222" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="345" height="3" rx="1.5" fill="#2563eb"/>
        
        <circle cx="36" cy="38" r="16" fill="#2563eb" fill-opacity="0.25"/>
        <path d="M29 34 L36 39 L43 34 M29 42 H43 V34 H29 Z" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
        <text class="mono" x="64" y="42" font-size="10" font-weight="700" fill="#60a5fa" letter-spacing="1">DIRECT INQUIRIES</text>

        <text x="24" y="86" font-size="17" font-weight="800" fill="#ffffff">Engineering Intake</text>
        <text x="24" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="24" dy="0">Direct line to our systems team.</tspan>
          <tspan x="24" dy="20">Architectural consultation,</tspan>
          <tspan x="24" dy="20">contracts, and collaborations.</tspan>
        </text>

        <rect x="24" y="172" width="180" height="28" rx="6" fill="#2563eb" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
        <text class="mono" x="36" y="190" font-size="11" font-weight="700" fill="#60a5fa">Email Team →</text>
      </g>

      <!-- Card 3: GitHub & Open Source Ecosystem -->
      <g transform="translate(730, 0)">
        <rect width="345" height="220" rx="14" fill="#0c1222" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="345" height="3" rx="1.5" fill="#fbbf24"/>
        
        <circle cx="36" cy="38" r="16" fill="#d97706" fill-opacity="0.25"/>
        <path d="M36 29 C32 29 29 32 29 36 C29 39 31 42 34 43 V40 C33 40 32 39 32 38 M38 43 C41 42 43 39 43 36 C43 32 40 29 36 29" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
        <text class="mono" x="64" y="42" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="1">OPEN ECOSYSTEM</text>

        <text x="24" y="86" font-size="20" font-weight="800" fill="#ffffff">NemeaForge Org</text>
        <text x="24" y="116" font-size="12.5" font-weight="400" fill="#94a3b8">
          <tspan x="24" dy="0">Production starter templates,</tspan>
          <tspan x="24" dy="20">climate-tech telemetry portals,</tspan>
          <tspan x="24" dy="20">and open-source engines.</tspan>
        </text>

        <rect x="24" y="172" width="160" height="28" rx="6" fill="#d97706" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1"/>
        <text class="mono" x="38" y="190" font-size="11" font-weight="700" fill="#fbbf24">Explore Repos →</text>
      </g>
    </g>
  </g>
</svg>
