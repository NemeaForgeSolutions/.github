<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="NemeaForge Solutions - Elite Product Engineering Firm | Systems Architecture">
<title>NemeaForge Solutions - Elite Product Engineering &amp; Distributed Systems</title>
<desc>Cinematic hero banner for NemeaForge Solutions featuring live animated cyber-forge HUD, rotating engineering disciplines, and production metrics.</desc>
<defs>
<style><![CDATA[
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap');
  text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }

  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes blinkDot { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0.2; } }
  @keyframes pulseAura {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50% { opacity: 0.75; transform: scale(1.04); }
  }
  @keyframes riseMote {
    0% { transform: translateY(0); opacity: 0; }
    25% { opacity: 0.85; }
    75% { opacity: 0.5; }
    100% { transform: translateY(-80px); opacity: 0; }
  }
  @keyframes scrubTravel {
    0% { width: 0px; }
    100% { width: 440px; }
  }
  @keyframes scanline {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translateY(370px); opacity: 0; }
  }

  @keyframes role1 { 0%, 22% { opacity: 1; } 25%, 97% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes role2 { 0%, 24% { opacity: 0; } 27%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes role3 { 0%, 49% { opacity: 0; } 52%, 72% { opacity: 1; } 75%, 100% { opacity: 0; } }
  @keyframes role4 { 0%, 74% { opacity: 0; } 77%, 97% { opacity: 1; } 100% { opacity: 0; } }

  .spin { transform-box: fill-box; transform-origin: center; animation: spinSlow 12s linear infinite; }
  .spin-rev { transform-box: fill-box; transform-origin: center; animation: spinRev 18s linear infinite; }
  .blink { animation: blinkDot 1.1s step-end infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulseAura 4s ease-in-out infinite; }
  .mote { animation: riseMote 5.5s ease-in-out infinite; }
  .scrub { animation: scrubTravel 4s linear infinite; }
  .scan { animation: scanline 4.5s ease-in-out infinite; }

  .role-1 { animation: role1 14s ease-in-out infinite; }
  .role-2 { animation: role2 14s ease-in-out infinite; }
  .role-3 { animation: role3 14s ease-in-out infinite; }
  .role-4 { animation: role4 14s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
    .role-2, .role-3, .role-4 { display: none; }
  }
]]></style>

<!-- Gradients -->
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#070a14"/>
  <stop offset="100%" stop-color="#04060a"/>
</linearGradient>

<pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="14" cy="14" r="0.9" fill="#38bdf8" fill-opacity="0.08"/>
</pattern>

<linearGradient id="brandTitle" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#38bdf8"/>
  <stop offset="35%" stop-color="#2563eb"/>
  <stop offset="70%" stop-color="#818cf8"/>
  <stop offset="100%" stop-color="#fbbf24"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="9s" repeatCount="indefinite"/>
</linearGradient>

<linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#38bdf8"/>
  <stop offset="50%" stop-color="#2563eb"/>
  <stop offset="100%" stop-color="#fbbf24"/>
</linearGradient>

<linearGradient id="borderEdge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
  <stop offset="35%" stop-color="#2563eb" stop-opacity="0.5"/>
  <stop offset="70%" stop-color="#1e293b" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
</linearGradient>

<radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
  <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
  <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
</radialGradient>

<linearGradient id="emblemGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38bdf8"/>
  <stop offset="50%" stop-color="#2563eb"/>
  <stop offset="100%" stop-color="#fbbf24"/>
</linearGradient>

<filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<filter id="blurOrbs" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="75"/>
</filter>

<clipPath id="bannerClip"><rect width="1280" height="560" rx="24"/></clipPath>
<clipPath id="hudClip"><rect x="680" y="50" width="548" height="400" rx="16"/></clipPath>
</defs>

<g clip-path="url(#bannerClip)">
  <!-- Background Base -->
  <rect width="1280" height="560" fill="url(#bgGrad)"/>
  <rect width="1280" height="560" fill="url(#gridDots)"/>

  <!-- Glowing Ambient Atmospheric Lights -->
  <g filter="url(#blurOrbs)">
    <circle cx="180" cy="140" r="190" fill="url(#glowCyan)"/>
    <circle cx="980" cy="240" r="230" fill="url(#glowGold)"/>
    <circle cx="640" cy="460" r="180" fill="url(#glowPurple)"/>
  </g>

  <!-- Outer Banner Border -->
  <rect x="1" y="1" width="1278" height="558" rx="23" fill="none" stroke="url(#borderEdge)" stroke-width="1.8"/>

  <!-- ==================== LEFT COLUMN: BRAND & VALUE PROP ==================== -->
  
  <!-- Terminal Status Pill / Breadcrumb -->
  <g transform="translate(54, 62)">
    <rect x="-8" y="-12" width="270" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="6" cy="2" r="3.5" fill="#38bdf8" class="blink"/>
    <text class="mono" x="18" y="6" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">SYSTEM // CLOUD MESH ONLINE</text>
  </g>

  <!-- Shell Prompt -->
  <g transform="translate(54, 114)">
    <text class="mono" font-size="13">
      <tspan font-weight="700" fill="#38bdf8">forge@nemea</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e2e8f0">deploy </tspan><tspan font-weight="700" fill="#fbbf24">--env=production</tspan><tspan fill="#64748b"> --zero-downtime</tspan>
    </text>
    <rect class="blink" x="424" y="-11" width="7" height="15" fill="#38bdf8"/>
  </g>

  <!-- Organization Title -->
  <text x="52" y="186" font-size="52" font-weight="900" letter-spacing="-1.2" fill="url(#brandTitle)" filter="url(#glowEffect)">
    NemeaForge Solutions
  </text>
  <rect x="54" y="204" width="168" height="3.5" rx="1.75" fill="url(#barGrad)"/>

  <!-- Rotating Engineering Disciplines -->
  <g transform="translate(54, 256)">
    <!-- Shield / Core Monogram Icon -->
    <g transform="translate(0, -6)">
      <circle cx="10" cy="1" r="10" fill="#2563eb" fill-opacity="0.2"/>
      <path d="M6 -4 L14 -4 L16 3 L10 7 L4 3 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Role 1 -->
    <g class="role-1">
      <text class="mono" x="30" y="6" font-size="17" font-weight="700" fill="#ffffff">Cloud-Native Distributed Systems &amp; Microservices</text>
    </g>
    <!-- Role 2 -->
    <g class="role-2">
      <text class="mono" x="30" y="6" font-size="17" font-weight="700" fill="#38bdf8">High-Throughput Go &amp; Node.js Production Engines</text>
    </g>
    <!-- Role 3 -->
    <g class="role-3">
      <text class="mono" x="30" y="6" font-size="17" font-weight="700" fill="#a78bfa">AI Systems, Vector Persistence &amp; RAG Pipelines</text>
    </g>
    <!-- Role 4 -->
    <g class="role-4">
      <text class="mono" x="30" y="6" font-size="17" font-weight="700" fill="#fbbf24">Next-Gen Full-Stack &amp; Satellite Telemetry Portals</text>
    </g>
  </g>

  <!-- Value Proposition Paragraph -->
  <text x="54" y="296" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    We build the software your business depends on — architecting resilient digital
  </text>
  <text x="54" y="320" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    products, mission-critical cloud backends, and high-velocity web platforms.
  </text>

  <!-- Production Metric Cards / HUD Badges -->
  <g transform="translate(54, 360)">
    <!-- Metric 1: SLA -->
    <g transform="translate(0, 0)">
      <rect width="180" height="96" rx="14" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#38bdf8"/>
      <text class="mono" x="16" y="34" font-size="28" font-weight="800" fill="#38bdf8">99.99%</text>
      <text class="mono" x="16" y="58" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">AVAILABILITY SLA</text>
      <text class="mono" x="16" y="76" font-size="9.5" fill="#64748b">Fault-tolerant mesh</text>
    </g>

    <!-- Metric 2: Velocity -->
    <g transform="translate(196, 0)">
      <rect width="180" height="96" rx="14" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#2563eb"/>
      <text class="mono" x="16" y="34" font-size="28" font-weight="800" fill="#60a5fa">ZERO-DEBT</text>
      <text class="mono" x="16" y="58" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">ENGINEERING DISCIPLINE</text>
      <text class="mono" x="16" y="76" font-size="9.5" fill="#64748b">Type-safe &amp; benchmarked</text>
    </g>

    <!-- Metric 3: Multi-Cloud -->
    <g transform="translate(392, 0)">
      <rect width="180" height="96" rx="14" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="3" rx="1.5" fill="#fbbf24"/>
      <text class="mono" x="16" y="34" font-size="28" font-weight="800" fill="#fbbf24">MULTI-CLOUD</text>
      <text class="mono" x="16" y="58" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">CONTAINER FABRIC</text>
      <text class="mono" x="16" y="76" font-size="9.5" fill="#64748b">Docker · K8s · Edge</text>
    </g>
  </g>

  <!-- Bottom Coordinates & Verification Footnote -->
  <g transform="translate(54, 496)">
    <circle cx="4" cy="-3" r="3" fill="#22c55e" class="blink"/>
    <text class="mono" x="16" y="0" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1">
      GLOBAL OPERATIONS // MELBOURNE · HYDERABAD · CLOUD EDGE
    </text>
  </g>

  <!-- ==================== RIGHT COLUMN: CYBER-FORGE TELEMETRY HUD ==================== -->
  
  <!-- HUD Outer Frame -->
  <g>
    <!-- Glassmorphism Container -->
    <rect x="680" y="50" width="548" height="400" rx="16" fill="#0b1222" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Subtle Scanline Sweep -->
    <g clip-path="url(#hudClip)">
      <line class="scan" x1="680" y1="50" x2="1228" y2="50" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.45"/>

      <!-- Atmospheric Floating Forge Spark Motes -->
      <circle class="mote" cx="740" cy="380" r="1.8" fill="#38bdf8" style="animation-delay: 0.3s"/>
      <circle class="mote" cx="890" cy="400" r="2.2" fill="#fbbf24" style="animation-delay: 1.6s"/>
      <circle class="mote" cx="1060" cy="390" r="1.6" fill="#60a5fa" style="animation-delay: 2.8s"/>
      <circle class="mote" cx="1170" cy="410" r="2.0" fill="#f59e0b" style="animation-delay: 1.0s"/>
    </g>

    <!-- Corner Viewfinder Brackets -->
    <path d="M694 72 V58 H708" fill="none" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1214 72 V58 H1200" fill="none" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M694 428 V442 H708" fill="none" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1214 428 V442 H1200" fill="none" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Top Live Badge in HUD -->
    <g transform="translate(1128, 68)">
      <rect x="-8" y="-10" width="78" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#22c55e" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="3" cy="0" r="3.2" fill="#22c55e" class="blink"/>
      <text class="mono" x="12" y="3" font-size="9" font-weight="800" fill="#22c55e" letter-spacing="1">ENGAGED</text>
    </g>

    <!-- HUD Header Sub-title -->
    <text class="mono" x="710" y="80" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
      FORGE TELEMETRY CONSOLE // CLUSTER 01
    </text>

    <!-- Central NemeaForge Geometric Interlocking Emblem & Orbital Rings -->
    <g transform="translate(954, 230)">
      <!-- Outer Pulsing Orbit -->
      <circle r="130" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="6 4" class="spin"/>
      <!-- Inner Reverse Orbit -->
      <circle r="105" fill="none" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="8 6" class="spin-rev"/>
      <!-- Concentric Aura Glow -->
      <circle r="75" fill="url(#glowCyan)" opacity="0.6" class="pulse"/>

      <!-- Cardinal Tick Marks -->
      <line x1="0" y1="-140" x2="0" y2="-125" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="140" x2="0" y2="125" stroke="#38bdf8" stroke-width="2"/>
      <line x1="-140" y1="0" x2="-125" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <line x1="140" y1="0" x2="125" y2="0" stroke="#38bdf8" stroke-width="2"/>

      <!-- NemeaForge Interlocking Geometric Emblem Path -->
      <g transform="scale(0.68) translate(-330, -250)" filter="url(#glowEffect)">
        <path fill="url(#emblemGrad)" d="M436.9,170.7L360.4,209 c-2.8,1.4-6.1-0.6-6.1-3.7l-0.2-32.3c0-2.3-1.9-4.2-4.2-4.2h-80.1c-1.6,0-3.1,0.9-3.8,2.3l-65.5,129.8c-0.2,0.5-0.4,1-0.4,1.5 c-3,30.6,19.7,20.3,19.7,20.3l74.9-37.8c2.8-1.4,6.1,0.6,6.1,3.8l-0.2,32.1c0,2.3,1.9,4.2,4.2,4.2h80.3c1.6,0,3.1-0.9,3.8-2.3 c7.3-14.7,47.5-95,62.9-125.6c15.6-30.9-9.5-27.5-13.7-26.7C437.6,170.4,437.3,170.5,436.9,170.7z M324,239.3l-69.8,35.1 c-3.6,1.8-7.5-2-5.7-5.6l34.9-70.4c0.7-1.4,2.2-2.3,3.8-2.3h35c2.3,0,4.2,1.9,4.2,4.2l-0.2,35.3C326.3,237.1,325.4,238.6,324,239.3 z M367.3,297.6h-35c-2.3,0-4.2-1.9-4.2-4.2l0.2-35.3c0-1.6,0.9-3,2.3-3.7l69.8-35.1c3.6-1.8,7.5,2,5.7,5.6l-34.9,70.4 C370.4,296.6,368.9,297.6,367.3,297.6z"/>
      </g>
    </g>

    <!-- HUD Telemetry Stat Blocks -->
    <g transform="translate(710, 360)">
      <rect width="116" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text class="mono" x="12" y="16" font-size="8.5" fill="#64748b">EDGE LATENCY</text>
      <text class="mono" x="12" y="30" font-size="12" font-weight="700" fill="#38bdf8">&lt; 12ms</text>
    </g>
    <g transform="translate(836, 360)">
      <rect width="116" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text class="mono" x="12" y="16" font-size="8.5" fill="#64748b">THROUGHPUT</text>
      <text class="mono" x="12" y="30" font-size="12" font-weight="700" fill="#60a5fa">38k req/s</text>
    </g>
    <g transform="translate(962, 360)">
      <rect width="116" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text class="mono" x="12" y="16" font-size="8.5" fill="#64748b">COMPLIANCE</text>
      <text class="mono" x="12" y="30" font-size="12" font-weight="700" fill="#fbbf24">SOC2/ISO Ready</text>
    </g>
    <g transform="translate(1088, 360)">
      <rect width="116" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text class="mono" x="12" y="16" font-size="8.5" fill="#64748b">ENG HEALTH</text>
      <text class="mono" x="12" y="30" font-size="12" font-weight="700" fill="#22c55e">100% NOMINAL</text>
    </g>

    <!-- Bottom HUD Scrub Control Bar -->
    <g transform="translate(710, 416)">
      <!-- Animated Rotating Spinner -->
      <g transform="translate(8, 6)" class="spin">
        <circle r="6" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="10 6"/>
      </g>
      <text class="mono" x="24" y="10" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.2">NFS_MESH_KERNEL.BIN</text>
      <text class="mono" x="496" y="10" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="1">DISTRIBUTED FABRIC · CONTINUOUS SYNC</text>
      <rect x="0" y="18" width="496" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect class="scrub" x="0" y="18" width="0" height="3" rx="1.5" fill="url(#barGrad)"/>
    </g>
  </g>
</g>
</svg>
